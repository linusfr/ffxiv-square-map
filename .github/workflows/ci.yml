name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Gate 1: the version this push would cut, tagging nothing yet ───────────
  checks:
    name: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next version (dry run — tags nothing)
        id: semrel
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          custom-arguments: '--provider-opt strip_v_tag_prefix=true'
          dry: true

  plugin:
    name: plugin
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud (staging)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/goatcorp/dalamud-distrib/raw/main/stg/latest.zip" -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath "$env:APPDATA\XIVLauncher\addon\Hooks\dev" -Force

      - name: Formatting
        shell: pwsh
        run: |
          dotnet format style plugin/SquareMap.csproj --verify-no-changes
          dotnet format analyzers plugin/SquareMap.csproj --verify-no-changes

      # Pull requests and release-less pushes build at a throwaway version; only
      # a push that semantic-release would actually cut gets the real one.
      - name: Build
        shell: pwsh
        run: |
          $ver = "${{ needs.checks.outputs.version }}"
          if (-not $ver) { $ver = "0.0.0" }
          dotnet build plugin/SquareMap.csproj --configuration Release -p:Version=$ver

      - name: Collect DalamudPackager output
        shell: pwsh
        run: |
          $zip = "plugin/bin/Release/SquareMap/latest.zip"
          if (-not (Test-Path $zip)) { Write-Error "DalamudPackager zip not found at $zip"; exit 1 }
          Copy-Item $zip SquareMap.zip

      - name: Upload for the release job
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: SquareMap.zip
          retention-days: 1

  # ── Only now is anything tagged, released or published ─────────────────────
  release:
    name: release
    needs: [checks, plugin]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.checks.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/download-artifact@v8
        with:
          name: plugin-zip

      - name: Tag and create the release
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          custom-arguments: '--provider-opt strip_v_tag_prefix=true'
          changelog-file: CHANGELOG.md

      - name: Attach the plugin
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.checks.outputs.version }}
          files: SquareMap.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      # The repo's manifest points at "latest", so it only needs the version
      # bumping for Dalamud to notice an update exists.
      - name: Point pluginmaster at the new release
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, time
          version = os.environ["VERSION"]
          entries = json.load(open("pluginmaster.json"))
          entries[0]["AssemblyVersion"] = version + ".0"
          entries[0]["LastUpdated"] = int(time.time())
          with open("pluginmaster.json", "w") as f:
              json.dump(entries, f, indent=2)
              # The pre-commit hooks insist on one, and without it every release
              # leaves a one-character diff behind for the next commit to trip on.
              f.write("\n")
          PY

      - name: Commit the manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          if [ -f CHANGELOG.md ]; then git add CHANGELOG.md; fi
          git diff --cached --quiet || git commit -m "chore: pluginmaster ${VERSION} [skip ci]"
          git push
        env:
          VERSION: ${{ needs.checks.outputs.version }}
